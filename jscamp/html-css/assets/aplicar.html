<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    


    <title>DevJobs - Aplicar</title>

</head>

<body>
    <header class="header">
        <div class="header-logo-container">
            <svg class="header-logo-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M7 8l-4 4l4 4" />
                <path d="M17 8l4 4l-4 4" />
                <path d="M14 4l-4 16" />
            </svg>
            <h2 class="header-logo-title">Devjobs</h2>
            <nav class="header-nav">
                <ul class="header-nav-links">
                    <li><a class="header-nav-link" href="index.html">Inicio</a></li>
                    <li><a class="header-nav-link" href="empleos.html">Empleos</a></li>
                    <li><a class="header-nav-link" href="#">Compañías</a></li>
                    <li><a class="header-nav-link" href="#">Salarios</a></li>
                </ul>
            </nav>

        </div>



        <div class="header-actions-container">
            <form class="hero-search-form-empleos" role="search">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                    <path d="M21 21l-6 -6" />
                </svg>
                <input class="hero-search-input" type="text" placeholder="Buscar trabajos, empresas o habilidades"
                    required>
            </form>

            <ul class="header-actions-links">
                <li><a class="link-blue" href="#">Subir CV</a></li>
                <li><a class="header-nav-link" href="#">
                        <img class="header-actions-profile-pic" src="../images/midu.jpg" alt="foto de perfil"
                            width="30" height="30" />
                    </a>
                </li>
            </ul>
        </div>
    </header>

    <main>
        <section>
            <div class="container">
                <div class="apply-page-container">
                    <h1 class="apply-page-title"></h1>
                    <p class="apply-page-subtitle"></p>
                    <button class="btn-blue" type="button">Aplicar</button>
                    <h2 class="apply-title">Descripción del puesto</h2>
                    <p class="apply-page-description">
                    </p>
                </div>
            </div>
        </section>
        <section class="responsabilities-section">
            <div class="container">
                <h2 class="apply-title">Responsabilidades</h2>
                <ul class="responsabilities-list">
                    <li class="responsabilities-list-item"></li>
                </ul>
            </div>
        </section>

        <section class="requirements-section">
            <div class="container">
                <h2 class="apply-title">Requisitos</h2>
                <ul class="requirements-list">
                    <li class="requirements-list-item"></li> 
                </ul>
            </div>
        </section>
    </main>
    <footer class="about-company-section">
            <div class="container">
                <h2 class="about-company-title">Sobre la compañía</h2>
                <p class="about-company-description"></p>
                <hr>
                <div class="footer-btn-container">
                    <a href="">
                        <button class="btn-blue-apply-job" type="button">Postularse</button>
                    </a>
                   
                </div>
            </div>
    </footer>
    <script src="aplicar.js"></script>
</body>

</html>
