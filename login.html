<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <title>Devjobs - Login</title>
</head>

<body class="body-login">
    <header class="header">
        <div class="header-logo-container">
            <svg class="header-logo-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M7 8l-4 4l4 4" />
                <path d="M17 8l4 4l-4 4" />
                <path d="M14 4l-4 16" />
            </svg>
            <h2 class="header-logo-title">Devjobs</h2>
        </div>
        <nav class="header-nav">

            <ul class="header-nav-links">
                <li><a class="header-nav-link" href="#">Buscar</a></li>
                <li><a class="header-nav-link" href="#">Compañías</a></li>
                <li><a class="header-nav-link" href="#">Sobre nosotros</a></li>
            </ul>
        </nav>

        <div class="header-actions-container">
            <ul class="header-actions-links">
                <li><a class="link-blue" href="">Publica tu empleo</a></li>
                <li><a class="link-white" href="login.html">Iniciar sesión</a></li>
            </ul>
        </div>
    </header>
    <main>
        <section class="login-presentation">
            <div class="login-container-presentation">
                <h1 class="login-presentation-title">Devjobs</h1>
                <p class="login-presentation-subtitle">Encuentra tu próximo trabajo como desarrollador</p>
            </div>
        </section>
        <section class="login-section">
            <div class="login-container">
                <form class="login-form">

  <!-- Campo Email con ícono dentro -->
  <div class="input-group">
    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
      <path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10" />
      <path d="M3 7l9 6l9 -6" />
    </svg>
    <input class="login-form-input" type="email" id="email" name="email" placeholder="Email" aria-label="Email">
  </div>

  <!-- Campo Password con ícono dentro -->
  <div class="input-group">
    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
      <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" />
      <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />
      <path d="M8 11v-4a4 4 0 1 1 8 0v4" />
    </svg>
    <input class="login-form-input" type="password" id="password" name="password" placeholder="Password" aria-label="Password">
  </div>

  <!-- Checkbox con label en línea -->
   <div class="login-form-checkbox-container">
      <label class="checkbox-label">
    <input class="login-form-checkbox" type="checkbox" id="remember-me" name="remember-me">
    <span>Recordarme</span>
    
  </label>
  <a class="login-form-link" href="#">¿Olvidaste tu contraseña?</a>
   </div>
   
  

  <button class="login-btn-blue" type="submit">Iniciar sesión</button>

 <div class="login-divider">
  <span class="divider-line"></span>
  <p class="login-form-text">¿No tienes cuenta?</p>
  <span class="divider-line"></span>
</div>

  <div class="login-form-links-container">
    <a class="login-form-link-election" href="#">Registrate como desarrollador</a>
    <a class="login-form-link-election" href="#">Registrate como empresa</a>
  </div>

</form>
            </div>
        </section>
    </main>
   
    <footer class="footer">
        <small class="footer-text">©2026 Devjobs. Todos los derechos reservados. </small>
    </footer>

</body>

</html>
