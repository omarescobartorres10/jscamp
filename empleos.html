<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/css/style.css">

    <title>DevJobs - Empleos</title>

</head>

<body>
    <header class="header">
        <div class="header-logo-container">
            <svg class="header-logo-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M7 8l-4 4l4 4" />
                <path d="M17 8l4 4l-4 4" />
                <path d="M14 4l-4 16" />
            </svg>
            <h2 class="header-logo-title">Devjobs</h2>
            <nav class="header-nav">
                <ul class="header-nav-links">
                    <li><a class="header-nav-link" href="index.html">Inicio</a></li>
                    <li><a class="header-nav-link" href="empleos.html">Empleos</a></li>
                    <li><a class="header-nav-link" href="#">Compañías</a></li>
                    <li><a class="header-nav-link" href="#">Salarios</a></li>
                </ul>
            </nav>

        </div>


        <div class="header-actions-container">
            <ul class="header-actions-links">
                <li class="link-blue"><a class="header-nav-link" href="#">Subir CV</a></li>
                <devjobs-avatar>
                    service="github"
                    username="midudev"
                    size="32"
                </devjobs-avatar>
            </ul>


        </div>

    </header>

    <main>
        <!-- SECCIÓN HERO -->
        <section class="hero-section-empleos">
            <div class="container">
                <h1 class="hero-title">Encuentra tu próximo trabajo</h1>
                <p class="hero-subtitle">Explora miles de oportunidades en el sector tecnológico</p>

                <form class="hero-search-form-empleos" role="search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                        <path d="M21 21l-6 -6" />
                    </svg>
                    <input id="input-buscar" class="hero-search-input" type="text"
                        placeholder="Buscar trabajos, empresas o habilidades" required>
                </form>

                <div class="hero-filters-section">
                    <select name="tecnologías" id="filter-techs">
                        <option value="">Tecnologías</option>
                        <option value="Frontend">Frontend</option>
                        <option value="Analista">Analista de Datos</option>
                        <option value="Movil">Desarrollador movil</option>
                        <option value="DevOps">Ingeniero DevOps</option>
                    </select>
                    <select name="ubicación" id="filter-ubicacion">
                        <option value="">Ubicación</option>
                        <option value="remoto">Remoto</option>
                        <option value="presencial">Presencial</option>
                        <option value="hibrido">Híbrido</option>
                    </select>
                    <select name="tipo-contrato" id="filter-tipo-contrato">
                        <option value="">Tipo de Contrato</option>
                        <option value="tiempo completo">Tiempo Completo</option>
                        <option value="medio tiempo">Medio Tiempo</option>
                        <option value="por proyecto">Por Proyecto</option>
                    </select>
                    <select name="experiencia" id="filter-experiencia">
                        <option value="">Experiencia</option>
                        <option value="sin experiencia">Sin experiencia</option>
                        <option value="junior">Junior</option>
                        <option value="mid">Mid</option>
                        <option value="senior">Senior</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- SECCIÓN RESULTADOS -->
        <section class="results-section">
            <div class="container">
                <h2 class="results-title">Resultados de búsqueda</h2>
                <p id="results-count"></p>
                <div id="results-container"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <nav class="pagination-container">
                <ul id="pagination-links" class="pagination-links">
                    <!-- buttons added dynamically -->
                </ul>

            </nav>
        </div>
    </footer>
    <script type="module" src="src/js/empleos.js"></script>
    <script src="src/js/devjobs-avatar-element.js" type="module"></script>
</body>

</html>
